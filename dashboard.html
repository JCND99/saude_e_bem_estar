<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    
    <!-- Faz o site funcionar bem em celular também -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Painel de Saúde</title>
    
    <!-- Arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Container principal onde fica toda a aplicação -->
<div class="container">
    
    <!-- Saudação com o nome do usuário -->
    <h1 id="saudacao">Olá! 👋</h1>
    
    <!-- Card com dicas de saúde que mudam automaticamente -->
    <div class="card dica-card">
        <small>💡 DICA SAUDÁVEL:</small>
        <p id="dicaAlimentacao">Carregando dica...</p>
    </div>

    <!-- Card da hidratação -->
    <div class="card">
        <h3>💧 Hidratação</h3>
        
        <!-- Barra de progresso da água -->
        <div class="progress-bar">
            <div id="barraAgua" class="progress"></div>
        </div>

        <!-- Texto mostrando quanto já bebeu -->
        <p id="aguaTexto" style="text-align:center; font-weight:bold; color:#4facfe;">
            0ml / 0ml
        </p>

        <!-- Botões para adicionar ou remover água -->
        <div class="btn-group">
            <button class="btn-primary" onclick="alterarHabito('agua', 250)">+250ml</button>
            <button class="btn-danger" onclick="alterarHabito('agua', -250)">-250ml</button>
        </div>
    </div>

    <!-- Card das atividades diárias -->
    <div class="card">
        <h3>✅ Atividades</h3>

        <!-- Controle de frutas -->
        <div class="habit">
            <span>🍎 Frutas</span>
            <div class="habit-controls">
                <button onclick="alterarHabito('fruta', -1)">-</button>
                <span id="frutaQtd">0</span>
                <button onclick="alterarHabito('fruta', 1)">+</button>
            </div>
        </div>

        <!-- Controle de exercícios -->
        <div class="habit">
            <span>🏃 Exercícios</span>
            <div class="habit-controls">
                <button onclick="alterarHabito('treino', -1)">-</button>
                <span id="treinoQtd">0</span>
                <button onclick="alterarHabito('treino', 1)">+</button>
            </div>
        </div>

        <!-- Controle de café -->
        <div class="habit">
            <span>☕ Café</span>
            <div class="habit-controls">
                <button onclick="alterarHabito('cafe', -1)">-</button>
                <span id="cafeQtd">0</span>
                <button onclick="alterarHabito('cafe', 1)">+</button>
            </div>
        </div>
    </div>

    <!-- Botões de navegação e reset -->
    <div class="btn-group">
        <!-- Vai para a página de histórico -->
        <button onclick="window.location.href='historico.html'">📅 Histórico</button>
        
        <!-- Reseta os dados do dia -->
        <button onclick="resetarDia()" class="btn-danger">🔄 Resetar</button>
    </div>

</div>

<!-- Script principal do sistema -->
<script src="script.js"></script>

</body>
</html>
